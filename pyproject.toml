[project]
name = "astrbot_plugin_TimelineTRPG"
version = "0.8.0"
description = "为时间线TRPG规则制作的骰子机器人（AstrBot 插件）"
requires-python = ">=3.10"
dependencies = ["Pillow"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = ["fonts", "icons"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["timeline_trpg"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -q"
